<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CGTube</title>

<style>
:root{
    --bg:#0f0f0f;
    --panel:#171717;
    --card:#1b1b1b;
    --card2:#202020;
    --hover:#282828;
    --text:#f2f2f2;
    --sub:#a8a8a8;
    --border:#2a2a2a;
    --accent:#ff0000;
    --accent2:#f1c40f;
    --shadow:0 10px 30px rgba(0,0,0,.35);
}

body.light{
    --bg:#f5f5f5;
    --panel:#ffffff;
    --card:#ffffff;
    --card2:#fafafa;
    --hover:#ececec;
    --text:#111111;
    --sub:#555555;
    --border:#dddddd;
    --accent:#e40000;
    --accent2:#8a6a00;
    --shadow:0 10px 25px rgba(0,0,0,.08);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:background .25s ease,color .25s ease;
    overflow-x:hidden;
}

button, input{
    font:inherit;
}

/* APP LAYOUT */
#app{
    display:flex;
    min-height:100vh;
}

/* LEFT NAV */
.sidebar{
    width:92px;
    background:var(--panel);
    border-right:1px solid var(--border);
    padding:14px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    position:fixed;
    inset:0 auto 0 0;
    z-index:20;
}

.brand{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:10px 0 12px;
    margin-bottom:8px;
    border-bottom:1px solid var(--border);
}

.brand-mark{
    width:38px;
    height:38px;
    border-radius:12px;
    display:grid;
    place-items:center;
    background:linear-gradient(180deg, rgba(255,0,0,.15), rgba(255,0,0,.05));
    border:1px solid rgba(255,0,0,.25);
    box-shadow:var(--shadow);
}

.brand-mark svg{
    width:21px;
    height:21px;
    stroke:var(--accent);
}

.brand span{
    font-size:12px;
    font-weight:800;
    letter-spacing:.4px;
    color:var(--text);
}

.nav-btn{
    width:100%;
    border:none;
    background:transparent;
    color:var(--text);
    border-radius:18px;
    padding:12px 8px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
    transition:.18s ease;
}

.nav-btn:hover{
    background:var(--hover);
}

.nav-btn.active{
    background:rgba(255,0,0,.12);
    box-shadow:inset 0 0 0 1px rgba(255,0,0,.15);
}

.nav-btn svg{
    width:24px;
    height:24px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.nav-btn .label{
    font-size:11px;
    color:var(--sub);
    line-height:1;
}

.nav-btn.active .label{
    color:var(--text);
}

.nav-sep{
    width:60%;
    height:1px;
    background:var(--border);
    margin:2px 0;
}

/* CONTENT AREA */
.workspace{
    margin-left:92px;
    width:calc(100% - 92px);
    min-height:100vh;
}

/* TOP BAR */
.topbar{
    position:sticky;
    top:0;
    z-index:15;
    height:72px;
    background:rgba(0,0,0,.18);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:0 18px;
}

.top-left{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.logo-text{
    display:flex;
    flex-direction:column;
    line-height:1.05;
}

.logo-text strong{
    font-size:19px;
    letter-spacing:.2px;
}

.logo-text span{
    font-size:12px;
    color:var(--sub);
}

.search{
    flex:1;
    max-width:620px;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:999px;
    padding:11px 16px;
    box-shadow:var(--shadow);
}

.search svg{
    width:18px;
    height:18px;
    stroke:var(--sub);
    fill:none;
    stroke-width:1.9;
}

.search input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    font-size:14px;
}

.search input::placeholder{
    color:var(--sub);
}

.top-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.small-btn{
    border:none;
    background:var(--card2);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:999px;
    padding:10px 14px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:.18s ease;
}

.small-btn:hover{
    background:var(--hover);
}

.small-btn svg{
    width:17px;
    height:17px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.9;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* MAIN */
.main{
    padding:18px;
}

.section{
    margin-bottom:28px;
}

.section-head{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:12px;
    margin:6px 0 14px;
}

.section-head h2{
    margin:0;
    font-size:20px;
}

.section-head p{
    margin:0;
    color:var(--sub);
    font-size:13px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:16px;
}

.shorts-grid{
    grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));
}

.card{
    cursor:pointer;
    transition:.18s ease;
    min-width:0;
}

.card:hover{
    transform:translateY(-2px);
}

.thumb-wrap{
    position:relative;
    border-radius:16px;
    overflow:hidden;
    background:var(--card2);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
}

.thumb{
    width:100%;
    aspect-ratio:16/9;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    display:block;
}

.shorts-grid .thumb{
    aspect-ratio:9/16;
}

.short-tag{
    position:absolute;
    left:10px;
    top:10px;
    border-radius:999px;
    padding:5px 8px;
    font-size:10px;
    font-weight:800;
    background:rgba(255,0,0,.92);
    color:#fff;
    letter-spacing:.4px;
}

.card h3{
    margin:9px 2px 5px;
    font-size:14px;
    line-height:1.38;
    font-weight:700;
}

.card p{
    margin:0 2px;
    font-size:12px;
    color:var(--sub);
    line-height:1.35;
}

.empty{
    padding:16px 6px;
    color:var(--sub);
    font-size:14px;
}

/* SETTINGS PANEL */
.settings-panel{
    position:fixed;
    top:72px;
    left:92px;
    width:320px;
    max-width:calc(100vw - 112px);
    background:var(--panel);
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    border-radius:0 0 18px 0;
    box-shadow:var(--shadow);
    padding:16px;
    transform:translateX(-120%);
    opacity:0;
    pointer-events:none;
    transition:.22s ease;
    z-index:18;
}

.settings-panel.open{
    transform:translateX(0);
    opacity:1;
    pointer-events:auto;
}

.settings-panel h3{
    margin:0 0 12px;
    font-size:16px;
}

.settings-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px;
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:14px;
    margin-bottom:10px;
}

.settings-row strong{
    font-size:14px;
}

.settings-row span{
    display:block;
    margin-top:4px;
    font-size:12px;
    color:var(--sub);
}

.settings-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:14px;
}

.action-btn{
    width:100%;
    border:none;
    background:var(--card2);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    transition:.18s ease;
}

.action-btn:hover{
    background:var(--hover);
}

.action-btn svg{
    width:18px;
    height:18px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.9;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* PLAYER SCREEN */
#playerScreen{
    display:none;
    min-height:100vh;
    padding:18px;
    background:var(--bg);
}

body.playing #app{
    display:none;
}

body.playing #playerScreen{
    display:block;
}

.back-btn{
    position:fixed;
    top:16px;
    left:16px;
    z-index:50;
    border:none;
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:999px;
    padding:11px 16px;
    cursor:pointer;
    display:none;
    align-items:center;
    gap:9px;
    box-shadow:var(--shadow);
}

body.playing .back-btn{
    display:inline-flex;
}

.back-btn svg{
    width:18px;
    height:18px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.player-layout{
    max-width:1200px;
    margin:56px auto 0;
    display:grid;
    grid-template-columns:minmax(0,1fr);
    gap:16px;
}

.player-box{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:18px;
    overflow:hidden;
    border:1px solid var(--border);
    box-shadow:var(--shadow);
}

.player-box.short-mode{
    width:min(100%, 420px);
    aspect-ratio:9/16;
    margin:0 auto;
}

.player-box iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:none;
}

.video-meta{
    max-width:1000px;
    margin:0 auto;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 10px;
    border-radius:999px;
    background:rgba(255,0,0,.12);
    border:1px solid rgba(255,0,0,.2);
    color:var(--accent2);
    font-size:12px;
    font-weight:800;
    letter-spacing:.3px;
}

.video-meta h2{
    margin:12px 0 8px;
    font-size:24px;
    line-height:1.35;
}

.video-meta p{
    margin:0;
    color:var(--sub);
    font-size:14px;
}

/* RESPONSIVE */
@media (max-width: 900px){
    .sidebar{
        width:82px;
    }

    .workspace{
        margin-left:82px;
        width:calc(100% - 82px);
    }

    .settings-panel{
        left:82px;
    }

    .topbar{
        padding:0 12px;
    }

    .logo-text strong{
        font-size:17px;
    }

    .search{
        max-width:none;
    }
}

@media (max-width: 760px){
    .sidebar{
        width:72px;
        padding:12px 8px;
    }

    .workspace{
        margin-left:72px;
        width:calc(100% - 72px);
    }

    .settings-panel{
        left:72px;
        max-width:calc(100vw - 84px);
    }

    .topbar{
        height:auto;
        min-height:72px;
        padding:12px;
        flex-wrap:wrap;
    }

    .top-left{
        width:100%;
    }

    .search{
        order:3;
        width:100%;
        max-width:none;
    }

    .top-actions{
        margin-left:auto;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .shorts-grid{
        grid-template-columns:repeat(2, minmax(0,1fr));
    }

    .player-box.short-mode{
        width:100%;
    }

    .video-meta h2{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div id="app">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M4 12.5L12 5l8 7.5"></path>
                    <path d="M6.5 10.5V19h11V10.5"></path>
                    <path d="M10 19v-5h4v5"></path>
                </svg>
            </div>
            <span>CGTube</span>
        </div>

        <button class="nav-btn active" data-view="home" title="Principal">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 11.5L12 4l9 7.5"></path>
                <path d="M5.5 10.5V20h13V10.5"></path>
                <path d="M10 20v-6h4v6"></path>
            </svg>
            <div class="label">Principal</div>
        </button>

        <button class="nav-btn" data-view="shorts" title="Shorts">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 5.5l8 4.5-8 4.5"></path>
                <path d="M15 3.5a3.5 3.5 0 0 1 0 7"></path>
                <path d="M9 16.5l8 4.5-8 4.5"></path>
                <path d="M15 13.5a3.5 3.5 0 0 1 0 7"></path>
            </svg>
            <div class="label">Shorts</div>
        </button>

        <button class="nav-btn" data-view="settings" title="Configuración">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3.2"></circle>
                <path d="M12 2.8v2.4"></path>
                <path d="M12 18.8v2.4"></path>
                <path d="M4.8 12h2.4"></path>
                <path d="M16.8 12h2.4"></path>
                <path d="M6.5 6.5l1.7 1.7"></path>
                <path d="M15.8 15.8l1.7 1.7"></path>
                <path d="M17.5 6.5l-1.7 1.7"></path>
                <path d="M8.2 15.8l-1.7 1.7"></path>
            </svg>
            <div class="label">Config</div>
        </button>

        <div class="nav-sep"></div>

        <button class="nav-btn" id="randomShortNav" title="Short aleatorio">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h5l2 3 2-3h7"></path>
                <path d="M16 5l2 2-2 2"></path>
                <path d="M20 17h-5l-2-3-2 3H4"></path>
                <path d="M8 19l-2-2 2-2"></path>
            </svg>
            <div class="label">Random</div>
        </button>
    </aside>

    <div class="workspace">
        <header class="topbar">
            <div class="top-left">
                <div class="logo-text">
                    <strong>CGTube</strong>
                    <span>Videos, shorts y canales</span>
                </div>
            </div>

            <label class="search" aria-label="Buscar videos">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="6.5"></circle>
                    <path d="M16.2 16.2L21 21"></path>
                </svg>
                <input id="searchInput" type="text" placeholder="Buscar en CGTube..." />
            </label>

            <div class="top-actions">
                <button class="small-btn" id="settingsToggle" type="button">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="3.2"></circle>
                        <path d="M12 2.8v2.4"></path>
                        <path d="M12 18.8v2.4"></path>
                        <path d="M4.8 12h2.4"></path>
                        <path d="M16.8 12h2.4"></path>
                        <path d="M6.5 6.5l1.7 1.7"></path>
                        <path d="M15.8 15.8l1.7 1.7"></path>
                        <path d="M17.5 6.5l-1.7 1.7"></path>
                        <path d="M8.2 15.8l-1.7 1.7"></path>

                    Ajustes
                </button>

        </header>

        <main class="main">
            <section class="section" id="videosSection">
                <div class="section-head">
                    <h2>Videos</h2>
                    <p id="videosCount">0 videos</p>

                <div class="grid" id="videosGrid">
                    <div class="empty">Cargando videos...</div>
                </div>

            <section class="section" id="shortsSection">
                <div class="section-head">
                    <h2>Shorts</h2>
                    <p id="shortsCount">0 shorts</p>

                <div class="grid shorts-grid" id="shortsGrid">
                    <div class="empty">Cargando shorts...</div>
                </div>
            </section>
        </main>
    </div>

    <aside class="settings-panel" id="settingsPanel">
        <h3>Configuración</h3>

        <div class="settings-row">
            <div>
                <strong>Tema</strong>
                <span>Cambia entre claro y oscuro</span>
            </div>
            <button class="small-btn" id="themeBtn" type="button">Oscuro</button>
        </div>

        <div class="settings-actions">
            <button class="action-btn" id="randomShortBtn" type="button">
                <span>Reproducir short aleatorio</span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 7h5l2 3 2-3h7"></path>
                    <path d="M16 5l2 2-2 2"></path>
                    <path d="M20 17h-5l-2-3-2 3H4"></path>
                    <path d="M8 19l-2-2 2-2"></path>
                </svg>
            </button>

            <button class="action-btn" id="closeSettingsBtn" type="button">
                <span>Cerrar configuración</span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 6l12 12"></path>
                    <path d="M18 6L6 18"></path>
                </svg>
            </button>
        </div>
    </aside>
</div>

<div id="playerScreen">
    <button class="back-btn" id="backBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 5l-7 7 7 7"></path>
        </svg>
        Volver
    </button>

    <div class="player-layout">
        <div>
            <div class="player-box" id="playerWrapper">
                <iframe
                    id="player"
                    src=""
                    allow="autoplay; encrypted-media; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>

            <div class="video-meta">
                <div class="badge" id="kindBadge">VIDEO</div>
                <h2 id="title">Título</h2>
                <p id="channelName">Canal</p>
            </div>
        </div>
    </div>
</div>

<script>
const rawItems = [
    "https://www.youtube.com/watch?v=HE1Yn_H4YpI",
    "https://www.youtube.com/watch?v=hLSAKlDYpKQ",
    "https://www.youtube.com/watch?v=DLskuafhcsg"
    // Puedes agregar shorts así:
    // "https://www.youtube.com/shorts/ID_DEL_SHORT"
];

const state = {
    view: "home",
    search: "",
    current: null,
    settingsOpen: false
};

let library = [];

const els = {
    app: document.getElementById("app"),
    playerScreen: document.getElementById("playerScreen"),
    player: document.getElementById("player"),
    playerWrapper: document.getElementById("playerWrapper"),
    title: document.getElementById("title"),
    channelName: document.getElementById("channelName"),
    kindBadge: document.getElementById("kindBadge"),
    backBtn: document.getElementById("backBtn"),
    searchInput: document.getElementById("searchInput"),
    videosSection: document.getElementById("videosSection"),
    shortsSection: document.getElementById("shortsSection"),
    videosGrid: document.getElementById("videosGrid"),
    shortsGrid: document.getElementById("shortsGrid"),
    videosCount: document.getElementById("videosCount"),
    shortsCount: document.getElementById("shortsCount"),
    sidebarButtons: [...document.querySelectorAll(".nav-btn[data-view]")],
    settingsPanel: document.getElementById("settingsPanel"),
    settingsToggle: document.getElementById("settingsToggle"),
    themeBtn: document.getElementById("themeBtn"),
    randomShortBtn: document.getElementById("randomShortBtn"),
    closeSettingsBtn: document.getElementById("closeSettingsBtn"),
    randomShortNav: document.getElementById("randomShortNav")
};

function escapeHTML(str = "") {
    return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
}

function getVideoId(input) {
    const text = String(input || "").trim();
    if (!text) return null;

    if (!text.includes("youtube.com") && !text.includes("youtu.be")) {
        return text;
    }

    try {
        const url = new URL(text);

        if (url.hostname.includes("youtu.be")) {
            const parts = url.pathname.split("/").filter(Boolean);
            return parts[0] || null;
        }

        const v = url.searchParams.get("v");
        if (v) return v;

        const parts = url.pathname.split("/").filter(Boolean);

        const shortIndex = parts.indexOf("shorts");
        if (shortIndex !== -1 && parts[shortIndex + 1]) return parts[shortIndex + 1];
