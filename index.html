<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CGTube | Chicken Gun Oficial</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{
    --bg:#0f0f0f;
    --card:#181818;
    --card2:#202020;
    --hover:#272727;
    --text:#fff;
    --sub:#aaa;
    --red:#ff0000;
    --yellow:#f1c40f;
    --border:#2a2a2a;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* HEADER */

header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:10px 20px;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:rgba(15,15,15,.96);
    backdrop-filter:blur(8px);
    z-index:1000;
    border-bottom:1px solid var(--border);
}

.logo{
    font-size:22px;
    font-weight:bold;
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
}

.logo i{
    color:var(--red);
    font-size:26px;
}

.logo span{
    color:var(--yellow);
}

.search{
    display:flex;
    align-items:center;
    gap:10px;
    background:#222;
    border:1px solid var(--border);
    border-radius:999px;
    padding:10px 16px;
    width:min(520px, 46vw);
}

.search input{
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    width:100%;
    font-size:14px;
}

.search i{
    color:#aaa;
}

/* CONTROLS */

.controls{
    margin-top:74px;
    padding:14px 20px 0;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.filter-btn{
    border:none;
    background:#1f1f1f;
    color:var(--text);
    padding:10px 14px;
    border-radius:999px;
    cursor:pointer;
    font-weight:700;
    border:1px solid var(--border);
    transition:.2s;
}

.filter-btn:hover{
    background:var(--hover);
}

.filter-btn.active{
    background:var(--text);
    color:#000;
}

/* HOME */

.home{
    padding:14px 20px 30px;
}

.section{
    margin-top:10px;
}

.section-head{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:10px;
    margin:10px 0 14px;
}

.section-head h2{
    margin:0;
    font-size:20px;
}

.section-head span{
    color:var(--sub);
    font-size:13px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:16px;
}

.shorts-grid{
    grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
}

.card{
    cursor:pointer;
    transition:.2s ease;
}

.card:hover{
    transform:translateY(-2px);
}

.thumb-wrap{
    position:relative;
    overflow:hidden;
    border-radius:14px;
    background:#222;
    border:1px solid #222;
}

.thumb{
    width:100%;
    aspect-ratio:16/9;
    background-size:cover;
    background-position:center;
    background-color:#222;
    display:block;
}

.shorts-grid .thumb{
    aspect-ratio:9/16;
}

.badge{
    position:absolute;
    left:10px;
    top:10px;
    padding:6px 10px;
    border-radius:999px;
    background:rgba(255,0,0,.9);
    color:#fff;
    font-size:11px;
    font-weight:800;
    letter-spacing:.3px;
}

.card h3{
    font-size:14px;
    margin:8px 0 5px;
    line-height:1.4;
}

.card p{
    font-size:12px;
    color:var(--sub);
    margin:0;
    line-height:1.4;
}

.empty{
    padding:20px 8px;
    color:var(--sub);
    font-size:14px;
}

/* PLAYER VIEW */

.player-view{
    display:none;
    gap:20px;
    padding:18px 20px 30px;
    margin-top:74px;
    grid-template-columns:minmax(0,1fr) 350px;
    align-items:start;
}

.back-btn{
    position:fixed;
    top:86px;
    left:20px;
    z-index:999;
    border:none;
    background:#1f1f1f;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:999px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:700;
}

.player-column{
    min-width:0;
}

.player-box{
    width:100%;
    aspect-ratio:16/9;
    position:relative;
    border-radius:16px;
    overflow:hidden;
    background:#000;
    border:1px solid #222;
}

.player-box.shorts-mode{
    width:min(100%, 420px);
    aspect-ratio:9/16;
    margin:0 auto;
}

.player-box iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:none;
}

.video-meta{
    margin-top:14px;
}

.kind-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 10px;
    border-radius:999px;
    background:#222;
    border:1px solid var(--border);
    color:var(--yellow);
    font-size:12px;
    font-weight:800;
    margin-bottom:10px;
}

.video-meta h2{
    margin:0;
    font-size:24px;
    line-height:1.35;
}

.video-meta p{
    margin:8px 0 0;
    color:var(--sub);
    font-size:14px;
}

.sidebar{
    background:#121212;
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
    position:sticky;
    top:92px;
}

.sidebar h3{
    margin:0 0 12px;
    font-size:16px;
}

.side-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.side-item{
    display:flex;
    gap:10px;
    cursor:pointer;
    padding:6px;
    border-radius:10px;
    transition:.2s;
}

.side-item:hover{
    background:var(--hover);
}

.side-thumb{
    width:120px;
    min-width:120px;
    height:70px;
    border-radius:10px;
    background-size:cover;
    background-position:center;
    background-color:#222;
    position:relative;
    overflow:hidden;
}

.side-item .short-flag{
    position:absolute;
    left:8px;
    top:8px;
    padding:4px 8px;
    border-radius:999px;
    background:rgba(255,0,0,.9);
    font-size:10px;
    font-weight:800;
}

.side-info{
    min-width:0;
}

.side-info h4{
    margin:0;
    font-size:13px;
    line-height:1.35;
}

.side-info p{
    margin:6px 0 0;
    font-size:11px;
    color:var(--sub);
    line-height:1.35;
}

.loading{
    color:var(--sub);
    padding:18px 2px;
    font-size:14px;
}

/* RESPONSIVE */

@media (max-width: 1020px){
    .player-view{
        grid-template-columns:1fr;
    }

    .sidebar{
        position:static;
    }
}

@media (max-width: 760px){
    header{
        padding:10px 12px;
    }

    .logo{
        font-size:18px;
    }

    .logo i{
        font-size:22px;
    }

    .search{
        width:100%;
    }

    .controls,
    .home,
    .player-view{
        padding-left:12px;
        padding-right:12px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .shorts-grid{
        grid-template-columns:repeat(2, minmax(0,1fr));
    }

    .player-box.shorts-mode{
        width:100%;
    }

    .video-meta h2{
        font-size:20px;
    }

    .back-btn{
        top:80px;
        left:12px;
    }
}
</style>
</head>
<body>

<header>
    <div class="logo">
        <i class="fa-brands fa-youtube"></i>
        CG<span>Tube</span>
    </div>

    <div class="search">
        <input type="text" id="searchInput" placeholder="Buscar en CGTube...">
        <i class="fas fa-search"></i>
    </div>

    <div style="width:40px;"></div>
</header>

<div class="controls">
    <button class="filter-btn active" data-filter="all">Todo</button>
    <button class="filter-btn" data-filter="video">Videos</button>
    <button class="filter-btn" data-filter="short">Shorts</button>
</div>

<main class="home" id="home">
    <section class="section" id="videosSection">
        <div class="section-head">
            <h2>Videos</h2>
            <span id="videoCount">0</span>
        </div>
        <div class="grid" id="videosGrid">
            <div class="loading">Cargando videos...</div>
        </div>
    </section>

    <section class="section" id="shortsSection">
        <div class="section-head">
            <h2>Shorts</h2>
            <span id="shortCount">0</span>
        </div>
        <div class="grid shorts-grid" id="shortsGrid">
            <div class="loading">Cargando shorts...</div>
        </div>
    </section>
</main>

<section class="player-view" id="playerView">
    <button class="back-btn" id="backBtn">
        <i class="fas fa-arrow-left"></i> Volver
    </button>

    <div class="player-column">
        <div class="player-box" id="playerWrapper">
            <iframe
                id="player"
                src=""
                allow="autoplay; encrypted-media; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>

        <div class="video-meta">
            <div class="kind-badge" id="kindBadge"></div>
            <h2 id="title"></h2>
            <p id="channelName"></p>
        </div>
    </div>

    <aside class="sidebar">
        <h3>Más para ver</h3>
        <div class="side-list" id="sidebar"></div>
    </aside>
</section>

<script>
/* 
    Pega aquí links completos o IDs.
    El sistema detecta:
    - watch?v=
    - youtu.be/
    - /shorts/
    - embed/
    - ID directo
*/

const rawItems = [
    "https://www.youtube.com/watch?v=HE1Yn_H4YpI",
    "https://www.youtube.com/watch?v=hLSAKlDYpKQ",
    "https://www.youtube.com/watch?v=DLskuafhcsg"

    // Ejemplo de short:
    // "https://www.youtube.com/shorts/ID_DEL_SHORT"
];

const state = {
    filter: "all",
    search: "",
    current: null
};

let library = [];

const els = {
    home: document.getElementById("home"),
    playerView: document.getElementById("playerView"),
    player: document.getElementById("player"),
    playerWrapper: document.getElementById("playerWrapper"),
    title: document.getElementById("title"),
    channelName: document.getElementById("channelName"),
    kindBadge: document.getElementById("kindBadge"),
    sidebar: document.getElementById("sidebar"),
    videosGrid: document.getElementById("videosGrid"),
    shortsGrid: document.getElementById("shortsGrid"),
    videosSection: document.getElementById("videosSection"),
    shortsSection: document.getElementById("shortsSection"),
    videoCount: document.getElementById("videoCount"),
    shortCount: document.getElementById("shortCount"),
    searchInput: document.getElementById("searchInput"),
    backBtn: document.getElementById("backBtn"),
    filterBtns: document.querySelectorAll(".filter-btn")
};

function escapeHTML(str = "") {
    return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
}

function extractYouTubeId(input) {
    const text = String(input || "").trim();
    if (!text) return null;

    if (!text.includes("youtube.com") && !text.includes("youtu.be")) {
        return text;
    }

    try {
        const url = new URL(text);

        if (url.hostname.includes("youtu.be")) {
            const parts = url.pathname.split("/").filter(Boolean);
            return parts[0] || null;
        }

        const v = url.searchParams.get("v");
        if (v) return v;

        const parts = url.pathname.split("/").filter(Boolean);

        const shortIndex = parts.indexOf("shorts");
        if (shortIndex !== -1 && parts[shortIndex + 1]) return parts[shortIndex + 1];

        const embedIndex = parts.indexOf("embed");
        if (embedIndex !== -1 && parts[embedIndex + 1]) return parts[embedIndex + 1];

        return null;
    } catch {
        const match = text.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([A-Za-z0-9_-]{6,})/);
        return match ? match[1] : text;
    }
}

function isShortInput(input) {
    const text = String(input || "").toLowerCase();
    return text.includes("/shorts/") || text.includes("youtube.com/shorts") || text.includes("youtu.be/shorts");
}

async function fetchMeta(rawInput) {
    const id = extractYouTubeId(rawInput);
    if (!id) return null;

    const type = isShortInput(rawInput) ? "short" : "video";
    const watchUrl = `https://www.youtube.com/watch?v=${id}`;

    const endpoints = [
        `https://www.youtube.com/oembed?url=${encodeURIComponent(watchUrl)}&format=json`,
        `https://noembed.com/embed?url=${encodeURIComponent(watchUrl)}`
    ];

    let data = null;

    for (const endpoint of endpoints) {
        try {
            const res = await fetch(endpoint);
            if (!res.ok) continue;

            const json = await res.json();
            if (json && (json.title || json.author_name)) {
                data = json;
                break;
            }
        } catch (e) {
            // Sigue al siguiente endpoint
        }
    }

    return {
        id,
        rawInput,
        type,
        title: data?.title || (type === "short" ? "Short de YouTube" : "Video de YouTube"),
        channel: data?.author_name || "Canal desconocido",
        thumb: `https://img.youtube.com/vi/${id}/hqdefault.jpg`
    };
}

function setActiveFilterButtons() {
    els.filterBtns.forEach(btn => {
        btn.classList.toggle("active", btn.dataset.filter === state.filter);
    });
}

function filteredLibrary() {
    const q = state.search.trim().toLowerCase();

    return library.filter(item => {
        const typeOk = state.filter === "all" || item.type === state.filter;
        const searchOk =
            !q ||
            item.title.toLowerCase().includes(q) ||
            item.channel.toLowerCase().includes(q);

        return typeOk && searchOk;
    });
}

function renderCards(container, items, emptyText) {
    if (!items.length) {
        container.innerHTML = `<div class="empty">${emptyText}</div>`;
        return;
    }

    container.innerHTML = items.map(item => `
        <article class="card" data-id="${escapeHTML(item.id)}">
            <div class="thumb-wrap">
                <div
                    class="thumb"
                    style="background-image:url('${item.thumb}')">
                </div>
                ${item.type === "short" ? `<div class="badge">SHORTS</div>` : ""}
            </div>
            <h3>${escapeHTML(item.title)}</h3>
            <p>${escapeHTML(item.channel)}</p>
        </article>
    `).join("");
}

function renderFeed() {
    const items = filteredLibrary();
    const videos = items.filter(item => item.type === "video");
    const shorts = items.filter(item => item.type === "short");

    els.videosSection.style.display = (state.filter === "short") ? "none" : "block";
    els.shortsSection.style.display = (state.filter === "video") ? "none" : "block";

    els.videoCount.textContent = `${videos.length} video${videos.length === 1 ? "" : "s"}`;
    els.shortCount.textContent = `${shorts.length} short${shorts.length === 1 ? "" : "s"}`;

    renderCards(
        els.videosGrid,
        videos,
        state.search ? "No se encontraron videos con esa búsqueda." : "Todavía no hay videos cargados."
    );

    renderCards(
        els.shortsGrid,
        shorts,
        state.search ? "No se encontraron shorts con esa búsqueda." : "Todavía no hay shorts cargados."
    );
}

function renderSidebar() {
    const currentId = state.current?.id;
    const recs = library
        .filter(item => item.id !== currentId)
        .slice(0, 12);

    if (!recs.length) {
        els.sidebar.innerHTML = `<div class="empty">No hay más recomendaciones.</div>`;
        return;
    }

    els.sidebar.innerHTML = recs.map(item => `
        <div class="side-item" data-side-id="${escapeHTML(item.id)}">
            <div class="side-thumb" style="background-image:url('${item.thumb}')">
                ${item.type === "short" ? `<span class="short-flag">SHORTS</span>` : ""}
            </div>
            <div class="side-info">
                <h4>${escapeHTML(item.title)}</h4>
                <p>${escapeHTML(item.channel)}</p>
            </div>
        </div>
    `).join("");
}

function playItem(id) {
    const item = library.find(v => v.id === id);
    if (!item) return;

    state.current = item;

    els.home.style.display = "none";
    els.playerView.style.display = "grid";

    els.title.textContent = item.title;
    els.channelName.textContent = item.channel;
    els.kindBadge.textContent = item.type === "short" ? "SHORTS" : "VIDEO";

    els.playerWrapper.classList.toggle("shorts-mode", item.type === "short");

    els.player.src = `https://www.youtube.com/embed/${item.id}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;

    renderSidebar();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function showHome() {
    els.player.src = "";
    els.playerView.style.display = "none";
    els.home.style.display = "block";
    state.current = null;
}

document.addEventListener("click", (e) => {
    const filterBtn = e.target.closest(".filter-btn");
    if (filterBtn) {
        state.filter = filterBtn.dataset.filter;
        setActiveFilterButtons();
        renderFeed();
        return;
    }

    const card = e.target.closest("[data-id]");
    if (card && card.dataset.id) {
        playItem(card.dataset.id);
        return;
    }

    const sideItem = e.target.closest("[data-side-id]");
    if (sideItem && sideItem.dataset.sideId) {
        playItem(sideItem.dataset.sideId);
        return;
    }

    if (e.target.closest("#backBtn")) {
        showHome();
    }
});

els.searchInput.addEventListener("input", () => {
    state.search = els.searchInput.value;
    renderFeed();
});

async function init() {
    els.videosGrid.innerHTML = `<div class="loading">Cargando videos...</div>`;
    els.shortsGrid.innerHTML = `<div class="loading">Cargando shorts...</div>`;

    const loaded = await Promise.all(rawItems.map(fetchMeta));
    library = loaded.filter(Boolean);

    renderFeed();
}

setActiveFilterButtons();
init();
</script>

</body>
</html>
